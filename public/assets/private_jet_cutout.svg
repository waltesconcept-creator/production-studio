<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="jetShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <g filter="url(#jetShadow)">
    <!-- Rear Vertical Stabilizer / Tail Fin -->
    <path d="M 680 190 L 760 70 L 805 70 L 755 210 Z" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="2" />
    <path d="M 750 90 L 780 90 L 740 180 L 725 180 Z" fill="url(#accentOrange)" />

    <!-- Left Wing (Perspective) -->
    <path d="M 460 215 L 260 360 L 330 365 L 560 235 Z" fill="url(#bodyGrad)" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 275 350 L 320 353 L 420 285 L 390 285 Z" fill="url(#accentOrange)" opacity="0.9" />

    <!-- Rear Horizontal Stabilizers -->
    <path d="M 740 120 L 840 110 L 845 125 L 755 140 Z" fill="#94A3B8" />

    <!-- Jet Engine Pod (Left) -->
    <ellipse cx="610" cy="180" rx="45" ry="18" fill="#334155" />
    <path d="M 590 162 L 670 170 L 665 195 L 585 198 Z" fill="url(#bodyGrad)" />
    <ellipse cx="585" cy="180" rx="14" ry="17" fill="#0F172A" stroke="#FF5500" stroke-width="2" />

    <!-- Main Aerodynamic Fuselage (Luxury Gulfstream Silhouette) -->
    <path d="M 110 235 Q 260 215, 520 215 Q 740 215, 810 210 Q 770 245, 580 250 Q 280 255, 110 235 Z" 
          fill="url(#bodyGrad)" stroke="#F8FAFC" stroke-width="2" />

    <!-- Speed Stripe along fuselage -->
    <path d="M 160 236 Q 380 230, 770 218 L 765 224 Q 380 236, 165 240 Z" fill="url(#accentOrange)" />

    <!-- Cockpit Windshield Visor (Gloss Tint) -->
    <path d="M 140 231 Q 195 224, 230 225 L 225 233 Q 190 232, 145 235 Z" fill="url(#glassGrad)" />

    <!-- Cabin Windows Array -->
    <g fill="#0F172A" opacity="0.85">
      <ellipse cx="300" cy="230" rx="5" ry="7" />
      <ellipse cx="330" cy="230" rx="5" ry="7" />
      <ellipse cx="360" cy="230" rx="5" ry="7" />
      <ellipse cx="390" cy="230" rx="5" ry="7" />
      <ellipse cx="420" cy="230" rx="5" ry="7" />
      <ellipse cx="450" cy="230" rx="5" ry="7" />
      <ellipse cx="480" cy="230" rx="5" ry="7" />
      <ellipse cx="510" cy="230" rx="5" ry="7" />
      <ellipse cx="540" cy="230" rx="5" ry="7" />
    </g>
  </g>
</svg>
